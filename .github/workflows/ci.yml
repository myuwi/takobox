name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nix
        uses: cachix/install-nix-action@v31

      - name: Use the fenix binary cache
        uses: cachix/cachix-action@v17
        with:
          name: fenix
          skipPush: true

      - name: Build the dev shell
        run: nix develop -c true

      - name: Install workspace deps
        run: nix develop -c bun install --frozen-lockfile

      - name: Install E2E deps
        run: nix develop -c bun install --cwd e2e --frozen-lockfile

      - name: Lint TypeScript
        run: nix develop -c bun run lint

      - name: Test TypeScript
        run: nix develop -c bun run test

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend
          cmd-format: "nix develop -i -k HOME --command {0}"
          key: ${{ hashFiles('flake.lock') }}

      - name: Check Rust formatting
        working-directory: apps/backend
        run: nix develop -c cargo fmt --check

      - name: Run Clippy
        working-directory: apps/backend
        run: nix develop -c cargo clippy --locked --all-targets -- -D warnings

      - name: Test Rust
        working-directory: apps/backend
        run: nix develop -c cargo test --locked

  build:
    name: Build images
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/takobox-web:sha-${{ github.sha }}

      - name: Build and push server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/takobox-server:sha-${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  e2e:
    name: E2E tests
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install E2E deps and browsers
        run: bun run test:e2e:install

      - name: Run E2E tests
        env:
          E2E_SKIP_BUILD: "1"
          TAKOBOX_IMAGE_TAG: sha-${{ github.sha }}
        run: bun run test:e2e

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: e2e/.artifacts
          retention-days: 7

  promote:
    name: Promote images
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote web image to main
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/takobox-web:main \
            ghcr.io/${{ github.repository_owner }}/takobox-web:sha-${{ github.sha }}

      - name: Promote server image to main
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/takobox-server:main \
            ghcr.io/${{ github.repository_owner }}/takobox-server:sha-${{ github.sha }}
