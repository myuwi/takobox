name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.0
  RUST_TOOLCHAIN: 1.98.0
  NIGHTLY_TOOLCHAIN: nightly-2026-08-25
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install workspace deps
        run: bun install

      - name: Install E2E deps
        run: bun install --cwd e2e

      - name: Install Rust toolchains
        run: |
          rustup toolchain install ${{ env.NIGHTLY_TOOLCHAIN }} --profile minimal --component rustfmt --no-self-update
          rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --profile minimal --component clippy --no-self-update
          rustup default ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/backend

      - name: Lint TypeScript
        run: bun run lint

      - name: Test TypeScript
        run: bun run test

      - name: Check Rust formatting
        working-directory: apps/backend
        run: cargo +${{ env.NIGHTLY_TOOLCHAIN }} fmt --check

      - name: Run Clippy
        working-directory: apps/backend
        run: cargo clippy --all-targets -- -D warnings

      - name: Test Rust
        working-directory: apps/backend
        run: cargo test

  build-push:
    name: Build, Test and Push images
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/takobox-web:dev

      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/backend/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/takobox-server:dev
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install E2E deps and browsers
        run: bun run test:e2e:install

      - name: Run E2E tests
        env:
          E2E_SKIP_BUILD: "1"
        run: bun run test:e2e

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: e2e/.artifacts
          retention-days: 7

      - name: Push web image
        run: docker push ghcr.io/${{ github.repository_owner }}/takobox-web:dev

      - name: Push server image
        run: docker push ghcr.io/${{ github.repository_owner }}/takobox-server:dev
