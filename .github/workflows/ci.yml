name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
      server: ${{ steps.changes.outputs.server }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            web:
              - "apps/web/**"
              - "packages/**"
            server:
              - "apps/backend/**"

  check:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install workspace deps
        run: bun install

      - name: Install E2E deps
        run: bun install --cwd e2e

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup toolchain install nightly --profile minimal --component rustfmt

      - name: Lint TypeScript
        run: bun run lint

      - name: Test TypeScript
        run: bun run test

      - name: Check Rust formatting
        working-directory: apps/backend
        run: cargo +nightly fmt --check

      - name: Run Clippy
        working-directory: apps/backend
        run: cargo +stable clippy --all-targets -- -D warnings

      - name: Test Rust
        working-directory: apps/backend
        run: cargo +stable test

  build-push:
    name: Build and Push images
    needs: [changes, check]
    if: |
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web image
        uses: docker/build-push-action@v6
        if: needs.changes.outputs.web == 'true'
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/takobox-web:dev

      - name: Build server image
        uses: docker/build-push-action@v6
        if: needs.changes.outputs.server == 'true'
        with:
          context: .
          file: apps/backend/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/takobox-server:dev

      - name: Push web image
        if: needs.changes.outputs.web == 'true'
        run: docker push ghcr.io/${{ github.repository_owner }}/takobox-web:dev

      - name: Push server image
        if: needs.changes.outputs.server == 'true'
        run: docker push ghcr.io/${{ github.repository_owner }}/takobox-server:dev
