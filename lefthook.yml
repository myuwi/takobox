pre-commit:
  parallel: true
  commands:
    fmt:
      run: bun run fmt
    lint:
      run: bun run lint
    nix-fmt:
      glob: "*.nix"
      run: nixfmt --check {staged_files}
    rust-fmt:
      root: "apps/backend/"
      run: cargo fmt --check

pre-push:
  parallel: true
  commands:
    rust-clippy:
      root: "apps/backend/"
      run: cargo clippy --all-targets -- -D warnings
