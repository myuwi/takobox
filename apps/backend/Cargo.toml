[package]
name = "takobox"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
default-run = "takobox"

[dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", features = ["std"] }
figment = { version = "0.10.19", features = ["env"] }
nanoid = "0.5.0"
regex = "1.13.1"
salvo = { version = "0.95.2", features = ["affix-state", "logging", "oapi", "rate-limiter", "size-limiter"] }
sanitize-filename = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["migrate", "runtime-tokio", "sqlite", "time"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
tempfile = "3.27.0"
